name: Add Asset
description: Request or add a new SVG asset to the CDN (mark or badge)
labels: [asset, enhancement]
assignees: [rastislavcore]
body:
  - type: checkboxes
    id: location
    attributes:
      label: Location
      description: Where should the asset be added? You can select one or both.
      options:
        - label: Mark (mark/base)
        - label: Badge (badge/base)
    validations:
      required: true

  - type: input
    id: asset_name
    attributes:
      label: Asset name
      description: Used as filename - name.svg (e.g. mycoin, myapp)
      placeholder: e.g. mycoin
    validations:
      required: true

  - type: textarea
    id: source
    attributes:
      label: Source
      description: Link to official logo/source or attach the SVG. Base SVG must be single viewBox (e.g. 0 0 1024 1024), no g groups.
      placeholder: URL or description of where the asset comes from
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Any extra context (optional)
      placeholder: Optional
