name: Add Asset
description: Request or add a new SVG asset to the CDN (mark or badge)
title: "[Asset]: "
labels: [asset, enhancement]
assignees: [rastislavcore]
body:
  - type: markdown
    attributes:
      value: |
        **Please read the [README](https://github.com/bchainhub/corecdn#readme) before opening an issue.**
        You only add **one SVG file** in either `mark/base/` or `badge/base/`. All sizes (16–1024px) and PNG exports are **autogenerated** by the build script.

  - type: checkboxes
    id: location
    attributes:
      label: Location
      description: Where should the asset be added? You can select one or both. (one SVG per location: mark/base or badge/base)
      options:
        - label: "Mark — mark/base/{name}.svg"
          required: false
        - label: "Badge — badge/base/{name}.svg"
          required: false
    validations:
      required: true

  - type: input
    id: asset_name
    attributes:
      label: Asset name
      description: Used as filename — {name}.svg (e.g. mycoin, myapp)
      placeholder: e.g. mycoin
    validations:
      required: true

  - type: textarea
    id: source
    attributes:
      label: Source
      description: Link to official logo/source or attach the SVG. Base SVG must be single viewBox (e.g. 0 0 1024 1024), no <g> groups.
      placeholder: URL or description of where the asset comes from
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Any extra context (optional)
      placeholder: Optional
